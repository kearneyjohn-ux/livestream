name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  deploy:
    # GitHub Pages only accepts deploys from the repository's default branch.
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Browsers keep the app's files for a while; give every file of this version its own
      # address so a new version is fetched fresh, and publish the version for open pages
      # to check against.
      - name: Stamp this version
        run: |
          v="${GITHUB_SHA::8}"
          sed -i "s/?v=dev/?v=$v/g" index.html js/*.js
          echo "{\"version\":\"$v\"}" > version.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
